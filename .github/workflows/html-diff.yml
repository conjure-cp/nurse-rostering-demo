name: Generated HTML diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  html-diff:
    name: Compare generated HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build base export
        run: |
          npm ci
          npm run build
          EXPORT_HTML_DIR="$RUNNER_TEMP/base-html" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const source = "out";
          const destination = process.env.EXPORT_HTML_DIR;
          const buildId = fs.readFileSync(".next/BUILD_ID", "utf8").trim();

          function normalize(html) {
            return html
              .replace('<!DOCTYPE html><!--' + buildId.slice(0, 24).replace(/-/g, '_') + '-->', '<!DOCTYPE html><!--__BUILD_ID__-->')
              .replaceAll(buildId, '__BUILD_ID__')
              .replace(/<script[^>]+src="[^"]*\/_next\/static\/[^"]+"[^>]*><\/script>/g, '<script src="__NEXT_SCRIPT__"></script>')
              .replace(/(?:<script src="__NEXT_SCRIPT__"><\/script>)+/g, '<script src="__NEXT_SCRIPTS__"></script>')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/g, (script) =>
                script.replace(/(static\/chunks\/)[^"\\<>\s]+?\.js/g, '$1__JS_CHUNK__.js'));
          }

          function copyHtml(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                copyHtml(fullPath);
                continue;
              }

              if (!entry.isFile() || !entry.name.endsWith(".html")) {
                continue;
              }

              const relativePath = path.relative(source, fullPath);
              const outputPath = path.join(destination, relativePath);
              fs.mkdirSync(path.dirname(outputPath), { recursive: true });
              fs.writeFileSync(outputPath, normalize(fs.readFileSync(fullPath, "utf8")));
            }
          }

          copyHtml(source);
          NODE

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build PR export
        run: |
          npm ci
          npm run build
          EXPORT_HTML_DIR="$RUNNER_TEMP/head-html" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const source = "out";
          const destination = process.env.EXPORT_HTML_DIR;
          const buildId = fs.readFileSync(".next/BUILD_ID", "utf8").trim();

          function normalize(html) {
            return html
              .replace('<!DOCTYPE html><!--' + buildId.slice(0, 24).replace(/-/g, '_') + '-->', '<!DOCTYPE html><!--__BUILD_ID__-->')
              .replaceAll(buildId, '__BUILD_ID__')
              .replace(/<script[^>]+src="[^"]*\/_next\/static\/[^"]+"[^>]*><\/script>/g, '<script src="__NEXT_SCRIPT__"></script>')
              .replace(/(?:<script src="__NEXT_SCRIPT__"><\/script>)+/g, '<script src="__NEXT_SCRIPTS__"></script>')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/g, (script) =>
                script.replace(/(static\/chunks\/)[^"\\<>\s]+?\.js/g, '$1__JS_CHUNK__.js'));
          }

          function copyHtml(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                copyHtml(fullPath);
                continue;
              }

              if (!entry.isFile() || !entry.name.endsWith(".html")) {
                continue;
              }

              const relativePath = path.relative(source, fullPath);
              const outputPath = path.join(destination, relativePath);
              fs.mkdirSync(path.dirname(outputPath), { recursive: true });
              fs.writeFileSync(outputPath, normalize(fs.readFileSync(fullPath, "utf8")));
            }
          }

          copyHtml(source);
          NODE

      - name: Compare exported HTML
        id: diff
        run: |
          status=0
          diff -ru "$RUNNER_TEMP/base-html" "$RUNNER_TEMP/head-html" > "$RUNNER_TEMP/generated-html.diff" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Could not compare the generated HTML (diff exited with $status)."
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Generated HTML changed after normalization"
              echo
              echo "Generated HTML must match the base branch. Generated JS references and build IDs are normalized; content, styles, and deployment paths are preserved."
              echo "Review the uploaded \`generated-html-diff\` artifact if the HTML changes are unexpected."
              echo
              echo '```diff'
              head -n 200 "$RUNNER_TEMP/generated-html.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Generated HTML unchanged"
              echo
              echo "The exported HTML files match the base branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated HTML diff
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-html-diff
          path: ${{ runner.temp }}/generated-html.diff
          if-no-files-found: error

      - name: Fail on generated HTML changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::Generated HTML differs from the base branch. Review the generated-html-diff artifact and job summary."
          exit 1
